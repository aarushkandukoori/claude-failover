<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="750" viewBox="0 0 860 750" role="img" aria-labelledby="title desc">
<title id="title">claude-failover demo</title>
<desc id="desc">A terminal session. claude-accounts status lists two Claude accounts, personal and work, both OK. A headless claude -p run hits the usage limit on personal and runs again on work, which answers. Status then shows personal limited until its reset time, and claude-accounts sync copies the desktop app chats between the two accounts.</desc>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}.out{fill:#c9d1d9}.cmd{fill:#f0f6fc}.ps{fill:#7ee787}.comment{fill:#8b949e}.note{fill:#e3b341}.title{fill:#8b949e;font-size:12px}.f{animation:fade .2s ease-out both}.cover{opacity:0}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes hide{from{opacity:1}to{opacity:0}}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.f,.cover,.cursor{animation:none}}@keyframes type1{from{transform:translateX(0)}to{transform:translateX(171.6px)}}@keyframes type9{from{transform:translateX(0)}to{transform:translateX(553.8px)}}@keyframes type18{from{transform:translateX(0)}to{transform:translateX(171.6px)}}@keyframes type27{from{transform:translateX(0)}to{transform:translateX(156.0px)}}</style>
<clipPath id="screen"><rect x="1" y="37" width="858" height="712"/></clipPath>
<rect width="860" height="750" rx="10" fill="#0d1117"/>
<path d="M0 37V10A10 10 0 0 1 10 0H850A10 10 0 0 1 860 10V37Z" fill="#161b22"/>
<path d="M0 36.5H860" stroke="#30363d"/>
<circle cx="20" cy="18.5" r="6" fill="#ff5f57"/><circle cx="40" cy="18.5" r="6" fill="#febc2e"/><circle cx="60" cy="18.5" r="6" fill="#28c840"/>
<text class="title" x="430" y="23" text-anchor="middle">claude-failover</text>
<g clip-path="url(#screen)">
<text class="comment f" x="20.0" y="66" textLength="202.8" lengthAdjust="spacing" style="animation-delay:0.30s"># two accounts, both ready</text>
<g class="f" style="animation-delay:0.60s">
<text class="ps" x="20.0" y="85" textLength="7.8" lengthAdjust="spacing">$</text>
<text class="cmd" x="35.6" y="85" textLength="171.6" lengthAdjust="spacing">claude-accounts status</text>
<g class="cover" style="animation:type1 0.77s steps(22,end) 0.95s both,hide .01s 1.92s both">
<rect x="35.6" y="71" width="7.8" height="19" fill="#9da7b3"/>
<rect x="43.4" y="71" width="171.6" height="19" fill="#0d1117"/>
</g></g>
<text class="out f" x="20.0" y="104" textLength="624.0" lengthAdjust="spacing" style="animation-delay:2.17s">Claude accounts (headless order: personal -&gt; work; chat order: personal -&gt; work)</text>
<text class="out f" x="20.0" y="123" textLength="429.0" lengthAdjust="spacing" style="animation-delay:2.23s">  personal     OK                 you@example.com (max)</text>
<text class="out f" x="20.0" y="142" textLength="670.8" lengthAdjust="spacing" style="animation-delay:2.29s">               login ends by Dec 6 (could end from Dec 3; CLI date); renew from Nov 28</text>
<text class="out f" x="20.0" y="161" textLength="444.6" lengthAdjust="spacing" style="animation-delay:2.35s">  work         OK                 you@work.example (team)</text>
<text class="out f" x="20.0" y="180" textLength="670.8" lengthAdjust="spacing" style="animation-delay:2.41s">               login ends by Dec 4 (could end from Dec 1; CLI date); renew from Nov 26</text>
<text class="comment f" x="20.0" y="218" textLength="483.6" lengthAdjust="spacing" style="animation-delay:3.12s"># personal hits its usage limit, so the same run moves to work</text>
<g class="f" style="animation-delay:3.42s">
<text class="ps" x="20.0" y="237" textLength="7.8" lengthAdjust="spacing">$</text>
<text class="cmd" x="35.6" y="237" textLength="553.8" lengthAdjust="spacing">CLAUDE_FAILOVER_VERBOSE=1 claude -p "summarize today's failing CI runs"</text>
<g class="cover" style="animation:type9 1.60s steps(71,end) 3.77s both,hide .01s 5.57s both">
<rect x="35.6" y="223" width="7.8" height="19" fill="#9da7b3"/>
<rect x="43.4" y="223" width="553.8" height="19" fill="#0d1117"/>
</g></g>
<text class="note f" x="20.0" y="256" textLength="694.2" lengthAdjust="spacing" style="animation-delay:6.32s">[claude-failover] personal: You've hit your session limit · resets 4am (America/New_York)</text>
<text class="note f" x="20.0" y="275" textLength="179.4" lengthAdjust="spacing" style="animation-delay:6.38s">  -&gt; re-running on work</text>
<text class="out f" x="20.0" y="294" textLength="218.4" lengthAdjust="spacing" style="animation-delay:7.24s">3 runs failed on main today:</text>
<text class="out f" x="20.0" y="313" textLength="624.0" lengthAdjust="spacing" style="animation-delay:7.30s">- api-tests: test_refund_total fails since tax.py started rounding to 3 decimals</text>
<text class="out f" x="20.0" y="332" textLength="538.2" lengthAdjust="spacing" style="animation-delay:7.36s">- web-e2e: the login test timed out twice and passed on retry (flaky)</text>
<text class="out f" x="20.0" y="351" textLength="491.4" lengthAdjust="spacing" style="animation-delay:7.42s">- nightly: the docker build ran out of disk space on the runner</text>
<text class="comment f" x="20.0" y="389" textLength="343.2" lengthAdjust="spacing" style="animation-delay:8.13s"># personal is skipped until its limit resets</text>
<g class="f" style="animation-delay:8.43s">
<text class="ps" x="20.0" y="408" textLength="7.8" lengthAdjust="spacing">$</text>
<text class="cmd" x="35.6" y="408" textLength="171.6" lengthAdjust="spacing">claude-accounts status</text>
<g class="cover" style="animation:type18 0.77s steps(22,end) 8.78s both,hide .01s 9.75s both">
<rect x="35.6" y="394" width="7.8" height="19" fill="#9da7b3"/>
<rect x="43.4" y="394" width="171.6" height="19" fill="#0d1117"/>
</g></g>
<text class="out f" x="20.0" y="427" textLength="624.0" lengthAdjust="spacing" style="animation-delay:10.00s">Claude accounts (headless order: personal -&gt; work; chat order: personal -&gt; work)</text>
<text class="out f" x="20.0" y="446" textLength="624.0" lengthAdjust="spacing" style="animation-delay:10.06s">  personal     LIMITED            you@example.com (max)  until Tue Nov 10 4:00AM</text>
<text class="out f" x="20.0" y="465" textLength="686.4" lengthAdjust="spacing" style="animation-delay:10.12s">               last limit: You've hit your session limit · resets 4am (America/New_York)</text>
<text class="out f" x="20.0" y="484" textLength="670.8" lengthAdjust="spacing" style="animation-delay:10.18s">               login ends by Dec 6 (could end from Dec 3; CLI date); renew from Nov 28</text>
<text class="out f" x="20.0" y="503" textLength="444.6" lengthAdjust="spacing" style="animation-delay:10.24s">  work         OK                 you@work.example (team)</text>
<text class="out f" x="20.0" y="522" textLength="670.8" lengthAdjust="spacing" style="animation-delay:10.30s">               login ends by Dec 4 (could end from Dec 1; CLI date); renew from Nov 26</text>
<text class="comment f" x="20.0" y="560" textLength="491.4" lengthAdjust="spacing" style="animation-delay:11.01s"># copy the desktop app chats, so each account lists all of them</text>
<g class="f" style="animation-delay:11.31s">
<text class="ps" x="20.0" y="579" textLength="7.8" lengthAdjust="spacing">$</text>
<text class="cmd" x="35.6" y="579" textLength="156.0" lengthAdjust="spacing">claude-accounts sync</text>
<g class="cover" style="animation:type27 0.70s steps(20,end) 11.66s both,hide .01s 12.56s both">
<rect x="35.6" y="565" width="7.8" height="19" fill="#9da7b3"/>
<rect x="43.4" y="565" width="156.0" height="19" fill="#0d1117"/>
</g></g>
<text class="out f" x="20.0" y="598" textLength="358.8" lengthAdjust="spacing" style="animation-delay:12.81s">Desktop chats (app running, signed in as work)</text>
<text class="out f" x="20.0" y="617" textLength="148.2" lengthAdjust="spacing" style="animation-delay:12.87s">  personal  3 chats</text>
<text class="out f" x="20.0" y="636" textLength="249.6" lengthAdjust="spacing" style="animation-delay:12.93s">  work      2 chats  (signed in)</text>
<text class="out f" x="20.0" y="655" textLength="639.6" lengthAdjust="spacing" style="animation-delay:12.99s">  personal -&gt; work: 3 added - they appear after you quit and reopen the Claude app</text>
<text class="out f" x="20.0" y="674" textLength="210.6" lengthAdjust="spacing" style="animation-delay:13.05s">  work -&gt; personal: 2 added</text>
<text class="out f" x="20.0" y="693" textLength="319.8" lengthAdjust="spacing" style="animation-delay:13.11s">  backup - the chat folders as they were:</text>
<text class="out f" x="20.0" y="712" textLength="616.2" lengthAdjust="spacing" style="animation-delay:13.17s">    ~/.config/claude-failover/state/desktop-sync/backups/20261110-011033.tar.gz</text>
<g class="f" style="animation-delay:13.88s">
<text class="ps" x="20.0" y="731" textLength="7.8" lengthAdjust="spacing">$</text>
<rect x="35.6" y="717" width="7.8" height="19" fill="#9da7b3" class="cursor" style="animation:blink 1s step-end 13.88s 3"/>
</g>
</g>
<rect x=".5" y=".5" width="859" height="749" rx="9.5" fill="none" stroke="#30363d"/>
</svg>
